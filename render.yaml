# ==============================================================================
# QUIET BATTLES™ – RENDER BLUEPRINT SPECIFICATION
# Deploys the Spring Boot 3 Backend Web Service connected to Neon PostgreSQL
# ==============================================================================

services:
  - type: web
    name: quiet-battles-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: ohio
    healthCheckPath: /api/v1/health
    envVars:
      - key: SERVER_PORT
        value: 8081
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        value: jdbc:postgresql://ep-royal-star-bd0mc0ih-pooler.c-8.us-east-2.aws.neon.tech:5432/neondb?sslmode=require
      - key: DB_USERNAME
        value: neondb_owner
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION
        value: 86400000
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:3000,http://localhost:5173,https://quiet-battles.vercel.app
