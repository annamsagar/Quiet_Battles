# ==============================================================================
# QUIET BATTLES™ BACKEND – APPLICATION CONFIGURATION
# Monolithic Layered Architecture for Luxury Fashion Brand Website
# ==============================================================================

# Application Meta
spring.application.name=quiet-battles-backend
server.port=${SERVER_PORT:8081}
server.servlet.context-path=

# ==============================================================================
# PostgreSQL Database Connection
# Dynamically loaded via Environment Variables with local dev fallbacks
# ==============================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/quiet_battles_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:0000}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=QuietBattlesHikariPool

# ==============================================================================
# JPA / Hibernate Configuration
# Note: Initial development uses 'update'. Prepare for Flyway in later phases.
# ==============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ==============================================================================
# Springdoc OpenAPI / Swagger UI
# Accessible at: http://localhost:8081/swagger-ui/index.html
# ==============================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# ==============================================================================
# Logging Configuration
# ==============================================================================
logging.level.root=INFO
logging.level.com.quietbattles=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
