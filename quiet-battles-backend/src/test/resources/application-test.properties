# Test profile overrides
spring.application.name=quiet-battles-backend-test
server.port=0

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/quiet_battles_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:0000}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

logging.level.root=WARN
logging.level.com.quietbattles=INFO

