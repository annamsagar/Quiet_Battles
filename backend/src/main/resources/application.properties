# ==============================================================================
# QUIET BATTLES™ BACKEND – APPLICATION CONFIGURATION
# Monolithic Layered Architecture for Luxury Fashion Brand Website
# ==============================================================================

# Application Meta
spring.application.name=quiet-battles-backend
server.port=${SERVER_PORT:8081}
server.servlet.context-path=

# Optional local overrides for credentials (gitignored)
spring.config.import=optional:classpath:application-local.properties,optional:file:application-local.properties,optional:file:.env[.properties]

# ==============================================================================
# PostgreSQL Database Connection (Neon DB Serverless)
# Dynamically loaded via Environment Variables or application-local.properties
# ==============================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-royal-star-bd0mc0ih-pooler.c-8.us-east-2.aws.neon.tech:5432/neondb?sslmode=require}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_xNtLFubip9j7}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari Connection Pool Settings optimized for Serverless Neon DB
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.pool-name=QuietBattlesNeonHikariPool

# ==============================================================================
# JPA / Hibernate Configuration
# ==============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ==============================================================================
# Springdoc OpenAPI / Swagger UI
# Accessible at: http://localhost:8081/swagger-ui/index.html
# ==============================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# ==============================================================================
# Logging Configuration
# ==============================================================================
logging.level.root=INFO
logging.level.com.quietbattles=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
